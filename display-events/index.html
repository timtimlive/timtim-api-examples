<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Display events — TimTim.Live API</title>
    <style>
      body { font-family: system-ui, sans-serif; background: #fff; max-width: 960px; margin: 0 auto; padding: 24px 16px; color: #0f172a; }
      ul { list-style: none; padding: 0; display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
      li { border: 1px solid #e2e8f0; border-radius: 16px; padding: 12px 14px; }
      img { width: 100%; border-radius: 8px; }
      small { background: #fef3c7; color: #92400e; border-radius: 999px; padding: 2px 8px; font-weight: 700; }
      a { display: inline-block; background: #0e7490; color: #fff; padding: 8px 12px; border-radius: 10px; text-decoration: none; font-weight: 700; }
      a:focus-visible { outline: 3px solid #0f172a; outline-offset: 2px; }
    </style>
  </head>
  <body>
    <h1>Events in Washington</h1>
    <div id="events"><p>Loading…</p></div>
    <script type="module">
      import { renderEvents } from "./render.mjs";
      const box = document.getElementById("events");
      try {
        // No key: sample events from the keyless demo endpoint (CORS *, works from any website).
        const res = await fetch("https://api.timtim.live/v1/demo/events?city=Washington");
        const body = await res.json();
        if (!res.ok) throw new Error(`${body.title} (request ${body.request_id})`);
        renderEvents(box, body.events);
      } catch (err) {
        box.textContent = `Could not load events: ${err.message}`;
      }
    </script>
  </body>
</html>
